<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Chatbot</title>
    <style>
        :root {
            --bg: #f3f5fa;
            --surface: #ffffff;
            --text: #0b1426;
            --muted: #6b7280;
            --line: #e5e7eb;
            --bubble: #eceff5;
            --accent: #3167f0;
            --accent-600: #2558e3;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto',
                'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: var(--bg);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text);
        }

        .container {
            width: 95%;
            max-width: 1400px;
            height: 90vh;
            background: var(--bg);
            border-radius: 24px;
            padding: 16px;
            display: flex;
        }

        .layout {
            display: grid;
            grid-template-columns: 320px 1fr 320px;
            gap: 16px;
            width: 100%;
            height: 100%;
        }

        .card {
            background: var(--surface);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sidebar.card,
        .chat-area.card,
        .entities-panel.card {}

        .sidebar,
        .chat-area,
        .entities-panel {
            background: transparent;
        }

        .sidebar-header,
        .chat-header,
        .entities-header {
            position: relative;
            padding: 20px;
            background: var(--surface);
        }

        .sidebar-header::after,
        .chat-header::after,
        .entities-header::after {
            content: '';
            position: absolute;
            left: 20px;
            right: 20px;
            bottom: 0;
            height: 1px;
            background: var(--line);
        }

        .sessions-list,
        .messages-container,
        .collections-container,
        .entities-list {
            background: var(--surface);
        }

        .tab-navigation {
            background: var(--surface);
            position: relative;
        }

        .tab-navigation::after {
            content: '';
            position: absolute;
            left: 16px;
            right: 16px;
            bottom: 0;
            height: 1px;
            background: var(--line);
        }

        .auth-page {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            background: var(--surface);
        }

        .auth-page h1 {
            font-size: 2.2rem;
            margin-bottom: 8px;
            color: var(--text);
            font-weight: 800;
        }

        .auth-tabs {
            display: flex;
            gap: 8px;
            margin: 24px 0;
        }

        .auth-tabs button {
            padding: 10px 20px;
            border: none;
            border-radius: 999px;
            background: var(--bubble);
            color: var(--muted);
            cursor: pointer;
        }

        .auth-tabs button.active {
            background: var(--accent);
            color: #fff;
        }

        .auth-form {
            width: 100%;
            max-width: 420px;
        }

        .auth-form input {
            width: 100%;
            padding: 14px 16px;
            margin: 10px 0;
            border: none;
            border-radius: 12px;
            background: var(--bubble);
            color: var(--text);
            font-size: 1rem;
        }

        .auth-form input:focus {
            outline: 2px solid var(--accent);
        }

        .auth-form button {
            width: 100%;
            padding: 14px 18px;
            margin-top: 16px;
            border: none;
            border-radius: 12px;
            background: var(--accent);
            color: #fff;
            font-size: 1.05rem;
            cursor: pointer;
        }

        .auth-form button:hover {
            background: var(--accent-600);
        }

        .error-message {
            color: #b91c1c;
            background: #fee2e2;
            padding: 10px;
            border-radius: 8px;
            margin: 10px 0;
            text-align: center;
        }

        .error-message:empty {
            display: none;
        }

        .success-message {
            color: #065f46;
            background: #d1fae5;
            padding: 10px;
            border-radius: 8px;
            margin: 10px 0;
            text-align: center;
        }

        /* -------------------- Sidebar -------------------- */
        .sidebar {
            width: 320px;
            background: var(--surface);
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 20px;
            position: relative;
        }

        .sidebar-header::after {
            content: '';
            display: block;
            height: 1px;
            background: var(--line);
            position: absolute;
            left: 20px;
            right: 20px;
            bottom: 0;
        }

        .sidebar-header h2 {
            margin-bottom: 8px;
            color: var(--text);
            font-size: 1.1rem;
            font-weight: 800;
        }

        .user-email {
            font-size: 0.9rem;
            color: var(--muted);
        }

        .new-session-btn {
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            border: none;
            border-radius: 12px;
            background: var(--accent);
            color: #fff;
            cursor: pointer;
            font-size: 1rem;
        }

        .new-session-btn:hover {
            background: var(--accent-600);
        }

        .sessions-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .session-item {
            padding: 12px;
            margin: 6px 0;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bubble);
            color: var(--text);
        }

        .session-item:hover {
            filter: brightness(0.98);
        }

        .session-item.active {
            background: #eff6ff;
            color: black;
        }

        .session-actions {
            display: flex;
            gap: 6px;
        }

        .session-actions button {
            padding: 6px 10px;
            border: none;
            background: transparent;
            cursor: pointer;
            border-radius: 8px;
            color: inherit;
        }

        .session-actions:hover {
            background: transparent;
        }

        .logout-btn {
            padding: 14px;
            border: none;
            background: var(--bubble);
            color: var(--text);
            cursor: pointer;
            font-size: 1rem;
        }

        /* -------------------- Chat Area -------------------- */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            padding: 20px;
            background: var(--surface);
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header::after {
            content: '';
            display: block;
            height: 1px;
            background: var(--line);
            position: absolute;
            left: 20px;
            right: 20px;
            bottom: 0;
        }

        .chat-header h2 {
            color: var(--text);
            font-size: 1.2rem;
            font-weight: 800;
        }

        .clear-btn {
            padding: 10px 14px;
            border: none;
            border-radius: 12px;
            background: var(--bubble);
            color: var(--text);
            cursor: pointer;
            font-size: 0.95rem;
        }

        .clear-btn:hover {
            filter: brightness(0.97);
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: var(--surface);
        }

        .message {
            margin: 14px 0;
            display: flex;
            gap: 10px;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 70%;
            padding: 14px;
            border-radius: 16px;
            line-height: 1.55;
            background: var(--bubble);
            color: var(--text);
        }

        .message.user .message-content {
            background: var(--bubble);
            color: var(--text);
        }

        .message.assistant .message-content {
            background: var(--bubble);
            color: var(--text);
        }

        .classifications-container {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }

        .classification-badge,
        .intent-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            background: var(--bubble);
            color: var(--muted);
        }

        .intent-badge {
            margin-left: 6px;
        }

        /* Блок «назначение роли» — плоский */
        .role-assignment {
            margin-top: 12px;
            padding: 12px;
            border-radius: 12px;
            background: #f6f8fc;
        }

        .role-assignment-title {
            font-weight: 700;
            color: var(--text);
            margin-bottom: 6px;
            font-size: 0.85rem;
        }

        .role-info {
            margin: 6px 0;
            padding: 8px;
            border-radius: 10px;
            background: #f8fafd;
        }

        .role-info-label {
            font-weight: 700;
            color: var(--muted);
            font-size: 0.75rem;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .role-info-title {
            color: var(--text);
            font-size: 0.95rem;
            font-weight: 600;
        }

        .role-info-position {
            color: var(--muted);
            font-size: 0.85rem;
            font-style: italic;
        }

        .role-info-path {
            color: #9ca3af;
            font-size: 0.8rem;
            margin-top: 4px;
        }

        .priority-badge {
            padding: 2px 6px;
            border-radius: 8px;
            font-size: 0.7rem;
            font-weight: 800;
            background: var(--bubble);
            color: var(--text);
        }

        .priority-badge.urgent {
            background: #fee2e2;
            color: #7f1d1d;
        }

        .priority-badge.high {
            background: #fff7ed;
            color: #9a3412;
        }

        .priority-badge.medium {
            background: #fef9c3;
            color: #78350f;
        }

        .priority-badge.low {
            background: #f1f5f9;
            color: #0f172a;
        }

        .classification-reasoning {
            display: block;
            margin-top: 8px;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            color: #6b7280;
            background: #f6f8fc;
            font-style: italic;
        }

        .classification-loading {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            margin-top: 8px;
            border-radius: 999px;
            font-size: 0.75rem;
            background: #f1f5f9;
            color: #6b7280;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 0.7;
            }

            50% {
                opacity: 1;
            }
        }

        /* Toast — без тени и без бордеров */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 12px 16px;
            background: var(--surface);
            border-radius: 12px;
            color: var(--text);
            z-index: 10000;
            max-width: 300px;
        }

        .toast.success {
            outline: 2px solid #c7d2fe;
        }

        .toast.error {
            outline: 2px solid #fecaca;
        }

        .toast.info {
            outline: 2px solid #bfdbfe;
        }

        /* Ввод */
        .input-area {
            padding: 16px;
            display: flex;
            gap: 10px;
            background: var(--surface);
            position: relative;
        }

        .input-area::before {
            content: '';
            display: block;
            height: 1px;
            background: var(--line);
            position: absolute;
            left: 16px;
            right: 16px;
            top: 0;
        }

        .input-area input {
            flex: 1;
            padding: 14px 16px;
            border: none;
            border-radius: 14px;
            background: var(--bubble);
            color: var(--text);
            font-size: 1rem;
        }

        .input-area input:focus {
            outline: 2px solid var(--accent);
        }

        .input-area button {
            padding: 14px 18px;
            border: none;
            border-radius: 14px;
            background: var(--accent);
            color: #fff;
            cursor: pointer;
            font-size: 1rem;
        }

        .input-area button:hover:not(:disabled) {
            background: var(--accent-600);
            transform: none;
        }

        .input-area button:disabled {
            background: #dce3f8;
            color: #94a3b8;
            cursor: not-allowed;
        }

        /* Плейсхолдеры */
        input::placeholder {
            color: #9ca3af;
            opacity: 1;
        }

        /* Пустое состояние */
        .empty-state {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            color: #94a3b8;
            background: var(--surface);
        }

        .empty-state h3 {
            font-size: 1.3rem;
            margin-bottom: 8px;
        }

        /* Лоадер */
        .loading {
            text-align: center;
            padding: 16px;
            color: #94a3b8;
        }

        .loading-spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 3px solid #dce3f8;
            border-radius: 50%;
            border-top-color: var(--accent);
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .hidden {
            display: none !important;
        }

        .main-interface {
            display: flex;
            width: 100%;
        }

        .chat-interface {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        /* Переименование */
        .rename-form {
            padding: 10px;
            background: #f8fafd;
            border-radius: 12px;
            margin: 6px 0;
        }

        .rename-form input {
            width: 100%;
            padding: 10px;
            margin-bottom: 6px;
            border: none;
            border-radius: 10px;
            background: var(--bubble);
            color: var(--text);
        }

        .rename-form input:focus {
            outline: 2px solid var(--accent);
        }

        .rename-form-buttons {
            display: flex;
            gap: 6px;
        }

        .rename-form button {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        .rename-form .save-btn {
            background: var(--accent);
            color: #fff;
        }

        .rename-form .save-btn:hover {
            background: var(--accent-600);
        }

        .rename-form .cancel-btn {
            background: #e5e7eb;
            color: #111827;
        }

        .rename-form .cancel-btn:hover {
            filter: brightness(0.97);
        }

        /* Панель сущностей */
        .entities-panel {
            width: 320px;
            background: var(--surface);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .entities-header {
            padding: 20px;
            position: relative;
        }

        .entities-header::after {
            content: '';
            display: block;
            height: 1px;
            background: var(--line);
            position: absolute;
            left: 20px;
            right: 20px;
            bottom: 0;
        }

        .entities-header h2 {
            margin-bottom: 6px;
            color: var(--text);
            font-size: 1.05rem;
            font-weight: 800;
        }

        .entities-stats {
            font-size: 0.85rem;
            color: var(--muted);
            margin-bottom: 8px;
        }

        .entities-filter {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        .filter-btn {
            padding: 6px 10px;
            background: var(--bubble);
            color: var(--muted);
            border: none;
            border-radius: 999px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .filter-btn:hover {
            filter: brightness(0.98);
            color: var(--text);
        }

        .filter-btn.active {
            background: var(--accent);
            color: #fff;
        }

        .entities-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .entity-item {
            background: var(--surface);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
            outline: 2px solid var(--line);
            /* мягкий контур вместо бордера, можно убрать вовсе */
        }

        .entity-type {
            font-size: 0.75rem;
            color: var(--muted);
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .entity-value {
            font-size: 0.95rem;
            color: var(--text);
            margin-bottom: 4px;
            font-weight: 600;
        }

        .entity-context {
            font-size: 0.85rem;
            color: #6b7280;
            font-style: italic;
        }

        .entity-date {
            font-size: 0.75rem;
            color: #9ca3af;
            margin-top: 4px;
        }

        .no-entities {
            text-align: center;
            color: #94a3b8;
            padding: 16px;
            font-size: 0.9rem;
        }

        /* Навигация по табам */
        .tab-navigation {
            display: flex;
            gap: 8px;
            padding: 16px;
            background: var(--surface);
            position: relative;
        }

        .tab-navigation::after {
            content: '';
            display: block;
            height: 1px;
            background: var(--line);
            position: absolute;
            left: 16px;
            right: 16px;
            bottom: 0;
        }

        .tab-btn {
            padding: 10px 14px;
            background: var(--bubble);
            color: var(--muted);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1rem;
        }

        .tab-btn:hover {
            filter: brightness(0.98);
            color: var(--text);
        }

        .tab-btn.active {
            background: var(--accent);
            color: #fff;
        }

        .tab-content {
            display: none;
            flex: 1;
            overflow: hidden;
        }

        .tab-content.active {
            display: flex;
            flex-direction: column;
        }

        /* Коллекции */
        .collections-container {
            padding: 16px;
            overflow-y: auto;
            flex: 1;
            height: 100%;
        }

        .collection-card {
            background: var(--surface);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
            outline: 2px solid var(--line);
        }

        .collection-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .collection-name {
            font-size: 1.05rem;
            color: var(--text);
            font-weight: 800;
        }

        .collection-actions {
            display: flex;
            gap: 6px;
        }

        .collection-actions button {
            padding: 6px 10px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.9rem;
            background: var(--bubble);
            color: var(--text);
        }

        .btn-clear {
            background: #fde68a;
            color: #7c2d12;
        }

        .btn-clear:hover {
            filter: brightness(0.98);
        }

        .btn-delete {
            background: #fca5a5;
            color: #7f1d1d;
        }

        .btn-delete:hover {
            filter: brightness(0.98);
        }

        .collection-stats {
            display: flex;
            gap: 16px;
            font-size: 0.9rem;
            color: var(--muted);
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .create-collection-form {
            background: var(--surface);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            color: var(--muted);
            margin-bottom: 6px;
            font-size: 0.9rem;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 12px;
            background: var(--bubble);
            color: var(--text);
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: 2px solid var(--accent);
        }

        .upload-area {
            background: var(--surface);
            border-radius: 12px;
            padding: 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            outline: 2px dashed var(--line);
        }

        .upload-area:hover,
        .upload-area.dragging {
            background: #f8fafd;
        }

        .chunker-description {
            margin-top: 10px;
            padding: 12px;
            background: #f8fafd;
            border-radius: 10px;
            color: #6b7280;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .chunker-description strong {
            color: var(--text);
        }

        .sessions-list::-webkit-scrollbar,
        .entities-list::-webkit-scrollbar,
        .messages-container::-webkit-scrollbar {
            width: 8px;
        }

        .sessions-list::-webkit-scrollbar-track,
        .entities-list::-webkit-scrollbar-track,
        .messages-container::-webkit-scrollbar-track {
            background: var(--surface);
        }

        .sessions-list::-webkit-scrollbar-thumb,
        .entities-list::-webkit-scrollbar-thumb,
        .messages-container::-webkit-scrollbar-thumb {
            background: #e2e8f0;
            border-radius: 4px;
        }

        .sessions-list::-webkit-scrollbar-thumb:hover,
        .entities-list::-webkit-scrollbar-thumb:hover,
        .messages-container::-webkit-scrollbar-thumb:hover {
            background: #cbd5e1;
        }

        .input-number {
            width: 100%;
            height: 36px;
            margin-top: 10px;
            margin-bottom: 3px;
            background: #ffffff;
            color: #0b1426;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 0 14px;
            font-size: 1rem;
            outline: none;

            appearance: auto;
            -webkit-appearance: auto;
            -moz-appearance: auto;
        }

        .input-number:focus {
            border-color: #3167f0;
            outline: 2px solid #3167f0;
            outline-offset: 0;
        }

        .input-number::-webkit-inner-spin-button,
        .input-number::-webkit-outer-spin-button {
            -webkit-appearance: inner-spin-button;
            margin: 0;
        }

        :root {
            --sb-thumb: #e1e6ef;
            --sb-thumb-hover: #cbd5e1;
        }

        * {
            scrollbar-width: thin;
            scrollbar-color: var(--sb-thumb) transparent;
        }

        *::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        *::-webkit-scrollbar-track {
            background: transparent;
        }

        *::-webkit-scrollbar-thumb {
            background: var(--sb-thumb);
            border-radius: 999px;
            border: 2px solid transparent;
            background-clip: padding-box;
        }

        *::-webkit-scrollbar-thumb:hover {
            background: var(--sb-thumb-hover);
        }

        .icon-btn {
            width: 32px;
            height: 32px;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .icon-btn svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: black;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* .icon-btn:hover {
        background: #e1e6ef;
      } */
        .icon-btn.rename:hover svg {
            stroke: rgb(33, 81, 212);
        }

        .edit-classification-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 4px;
            margin-left: 8px;
            opacity: 0.5;
            transition: opacity 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .edit-classification-btn:hover {
            opacity: 1;
        }

        .edit-classification-btn svg {
            width: 16px;
            height: 16px;
            stroke: #64748b;
        }

        .classification-editor-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
        }

        .classification-editor-content {
            background: white;
            border-radius: 12px;
            padding: 24px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .classification-editor-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 16px;
            color: #0b1426;
        }

        .classification-editor-message {
            background: #f8fafc;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            color: #475569;
        }

        .classification-editor-form-group {
            margin-bottom: 20px;
        }

        .classification-editor-form-group label {
            display: block;
            font-weight: 500;
            margin-bottom: 8px;
            color: #0b1426;
        }

        .classification-editor-select,
        .classification-editor-textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: inherit;
        }

        .classification-editor-select:focus,
        .classification-editor-textarea:focus {
            outline: none;
            border-color: #3167f0;
            box-shadow: 0 0 0 3px rgba(49, 103, 240, 0.1);
        }

        .classification-editor-textarea {
            min-height: 80px;
            resize: vertical;
        }

        .classification-editor-current {
            font-size: 0.85rem;
            color: #64748b;
            margin-top: 4px;
        }

        .classification-editor-buttons {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 24px;
        }

        .classification-editor-buttons button {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .classification-editor-cancel {
            background: #f1f5f9;
            color: #475569;
        }

        .classification-editor-cancel:hover {
            background: #e2e8f0;
        }

        .classification-editor-submit {
            background: #3167f0;
            color: white;
        }

        .classification-editor-submit:hover {
            background: #2451c7;
        }

        .classification-editor-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .icon-btn.delete:hover svg {
            stroke: #dc2626;
        }

        .icon-btn:focus-visible {
            outline: 2px solid white;
            outline-offset: 2px;
        }

        .icon-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>

<body>
    <div class="container">
        <div id="mainInterface" class="layout">
            <!-- Сайдбар как отдельная карточка -->
            <div class="sidebar card">
                <div class="sidebar-header">
                    <h2>Сессии чата</h2>
                    <div class="sidebar-user">
                        <label class="user-email">ID пользователя:</label>
                        <input class="input-number" type="number" id="userIdInput" value="1" min="1"
                            placeholder="ID пользователя" onchange="changeUserId(this.value)" />
                        <button class="new-session-btn" onclick="createNewSession()">
                            Новая сессия
                        </button>
                    </div>
                </div>
                <div class="sessions-list" id="sessionsList"></div>
            </div>

            <!-- Область чата как отдельная карточка -->
            <div class="chat-area card">
                <div class="tab-navigation">
                    <button class="tab-btn active" onclick="switchTab('chat')">
                        Чат
                    </button>
                </div>

                <div id="chatTab" class="tab-content active">
                    <div id="emptyState" class="empty-state">
                        <h3>Выберите или создайте сессию, чтобы начать общение</h3>
                    </div>

                    <div id="chatInterface" class="hidden chat-interface">
                        <div class="chat-header">
                            <h2 id="sessionName">Чат</h2>
                            <button class="clear-btn" onclick="clearChat()">
                                Очистить чат
                            </button>
                        </div>
                        <div class="messages-container" id="messagesContainer"></div>
                        <div class="input-area">
                            <input type="text" id="messageInput" placeholder="Введите сообщение…"
                                onkeypress="if(event.key === 'Enter') sendMessage()" />
                            <button id="sendBtn" onclick="sendMessage()">Отправить</button>
                        </div>
                    </div>
                </div>

            </div>

            <!-- Панель сущностей как отдельная карточка -->
            <div class="entities-panel card">
                <div class="entities-header">
                    <h2>Извлечённые данные</h2>
                    <div class="entities-stats" id="entitiesStats">0 сущностей</div>
                    <div class="entities-filter">
                        <button class="filter-btn active" onclick="filterEntities('all')">
                            Все
                        </button>
                        <button class="filter-btn" onclick="filterEntities('name')">
                            Имя
                        </button>
                        <button class="filter-btn" onclick="filterEntities('usage')">
                            Использование
                        </button>
                        <button class="filter-btn" onclick="filterEntities('preferences')">
                            Предпочтения
                        </button>
                        <button class="filter-btn" onclick="filterEntities('personal_info')">
                            Персональные данные
                        </button>
                    </div>
                </div>
                <div class="entities-list" id="entitiesList">
                    <div class="no-entities">
                        Пока ничего не извлечено. Начните переписку, чтобы увидеть
                        найденные сущности.
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Используем текущий хост для API запросов (работает с любым IP/доменом)
        const API_BASE = `${window.location.protocol}//${window.location.host}/api/v1`

        // Get user ID from URL parameter or default to 1
        function getUserIdFromUrl() {
            const urlParams = new URLSearchParams(window.location.search)
            return parseInt(urlParams.get('user_id')) || 1
        }

        // Global state management
        // ======= STATE =======
        class AppState {
            constructor() {
                this.userId = getUserIdFromUrl()
                this.activeSession = null
                this.sessions = []
                this.messages = []
                this.entities = []
                this.filteredEntities = []
                this.entityFilter = 'all'
                this.isLoading = false
            }

            setActiveSession(sessionId) {
                console.log('Setting active session:', sessionId)
                // очистка прошлых данных
                this.messages = []
                this.entities = []
                this.filteredEntities = []
                this.activeSession = sessionId
            }

            clearSession() {
                console.log('Clearing all session data')
                this.activeSession = null
                this.messages = []
                this.entities = []
                this.filteredEntities = []
            }
        }

        const state = new AppState()

        // ======= UTILS =======
        function showToast(message, type = 'info') {
            const toast = document.createElement('div')
            toast.className = `toast ${type}`
            toast.textContent = message
            document.body.appendChild(toast)

            setTimeout(() => {
                toast.style.animation = 'slideOut 0.3s ease-out'
                setTimeout(() => toast.remove(), 300)
            }, 3000)
        }

        function escapeHtml(text) {
            const div = document.createElement('div')
            div.textContent = text
            return div.innerHTML.replace(/\n/g, '<br>')
        }

        function getUserIdFromUrl() {
            const url = new URL(window.location)
            const u = url.searchParams.get('user_id')
            const n = Number(u)
            return Number.isFinite(n) && n > 0 ? n : 1
        }

        // ======= USER ID CHANGE =======
        async function changeUserId(newUserId) {
            const userId = parseInt(newUserId)
            if (userId < 1 || isNaN(userId)) {
                showToast('Некорректный ID пользователя', 'error')
                document.getElementById('userIdInput').value = state.userId
                return
            }
            if (userId === state.userId) return

            console.log('Changing user from', state.userId, 'to', userId)

            const oldUserId = state.userId
            state.userId = userId
            state.clearSession()

            // сразу очищаем UI
            const messagesContainer = document.getElementById('messagesContainer')
            messagesContainer.innerHTML = ''
            document.getElementById('entitiesList').innerHTML =
                '<div class="no-entities">Информация ещё не извлечена.</div>'
            document.getElementById('sessionsList').innerHTML =
                '<div class="loading"><div class="loading-spinner"></div><p>Загружаем сессии…</p></div>'

            // URL
            const url = new URL(window.location)
            url.searchParams.set('user_id', userId)
            window.history.pushState({}, '', url)

            // прячем чат
            document.getElementById('chatInterface').classList.add('hidden')
            document.getElementById('emptyState').classList.remove('hidden')

            await loadSessions()

            if (state.sessions.length > 0) {
                await selectSession(state.sessions[0])
            } else {
                renderEntities()
            }

            showToast(`Переключились на пользователя ID: ${userId}`, 'success')
            console.log('User changed successfully')
        }

        // ======= SESSIONS =======
        async function loadSessions() {
            try {
                const response = await fetch(
                    `${API_BASE}/auth/sessions?user_id=${state.userId}`
                )
                if (!response.ok) throw new Error('Failed to load sessions')
                const sessions = await response.json()
                state.sessions = sessions
                renderSessions()
            } catch (error) {
                console.error('Failed to load sessions:', error)
                state.sessions = []
                renderSessions()
            }
        }

        function renderSessions() {
            const container = document.getElementById('sessionsList')
            container.innerHTML = ''

            if (state.sessions.length === 0) {
                container.innerHTML =
                    '<div style="color:#64748b;padding:20px;text-align:center;">Сеансов пока нет</div>'
                return
            }

            console.log(
                'Rendering',
                state.sessions.length,
                'sessions. Active:',
                state.activeSession
            )

            state.sessions.forEach((session) => {
                const isActive = session.session_id === state.activeSession
                const sessionDiv = document.createElement('div')
                sessionDiv.className = 'session-item' + (isActive ? ' active' : '')
                sessionDiv.dataset.sessionId = session.session_id

                const name =
                    session.name || `Сессия ${session.session_id.substring(0, 8)}`

                const nameSpan = document.createElement('span')
                nameSpan.textContent = name
                nameSpan.style.cursor = 'pointer'
                nameSpan.style.flex = '1'
                nameSpan.addEventListener('click', () => selectSession(session))

                const actionsDiv = document.createElement('div')
                actionsDiv.className = 'session-actions'

                const renameBtn = document.createElement('button')
                renameBtn.className = 'icon-btn rename'
                renameBtn.type = 'button'
                renameBtn.title = 'Переименовать'
                renameBtn.setAttribute('aria-label', 'Переименовать')
                renameBtn.innerHTML = `
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 20h9" />
        <path d="M16.5 3.5l4 4L8 20l-5 1 1-5L16.5 3.5z" />
      </svg>
    `
                renameBtn.onclick = (e) => {
                    e.stopPropagation()
                    startRename(session.session_id, name)
                }

                const deleteBtn = document.createElement('button')
                deleteBtn.className = 'icon-btn delete'
                deleteBtn.type = 'button'
                deleteBtn.title = 'Удалить'
                deleteBtn.setAttribute('aria-label', 'Удалить')
                deleteBtn.innerHTML = `
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 6h18" />
        <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
        <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
        <path d="M10 11v6" />
        <path d="M14 11v6" />
      </svg>
    `
                deleteBtn.onclick = (e) => {
                    e.stopPropagation()
                    deleteSession(session.session_id)
                }

                actionsDiv.appendChild(renameBtn)
                actionsDiv.appendChild(deleteBtn)

                sessionDiv.appendChild(nameSpan)
                sessionDiv.appendChild(actionsDiv)

                container.appendChild(sessionDiv)
            })
        }

        async function createNewSession() {
            if (state.isLoading) return
            state.isLoading = true

            try {
                const url = `${API_BASE}/auth/session?user_id=${state.userId}&name=New%20Session`
                const response = await fetch(url, { method: 'POST' })
                if (!response.ok) {
                    const errorText = await response.text()
                    console.error('Error response:', errorText)
                    throw new Error('Failed to create session')
                }

                const data = await response.json()

                switchTab('chat')
                state.setActiveSession(data.session_id)
                try { localStorage.setItem(`last_session_${state.userId}`, data.session_id) } catch (e) { }
                await loadSessions()
                // Clear UI and ensure fresh state for the new session
                renderMessages()
                renderEntities()
                await loadMessages()
                showChatInterface()
                document.getElementById('messageInput').focus()
                showToast('Сессия создана', 'success')
            } catch (error) {
                console.error('Create session error:', error)
                showToast('Не удалось создать сессию: ' + error.message, 'error')
            } finally {
                state.isLoading = false
            }
        }

        async function selectSession(session) {
            if (state.isLoading) return
            if (state.activeSession === session.session_id) {
                console.log('Session already active, skipping reload')
                return
            }

            state.isLoading = true
            try {
                console.log('Selecting session:', session.session_id)
                switchTab('chat')
                const oldSessionId = state.activeSession
                state.setActiveSession(session.session_id)
                try { localStorage.setItem(`last_session_${state.userId}`, session.session_id) } catch (e) { }

                state.messages = []
                state.entities = []
                state.filteredEntities = []

                const messagesContainer = document.getElementById('messagesContainer')
                messagesContainer.innerHTML =
                    '<div class="loading"><div class="loading-spinner"></div><p>Загружаем сообщения…</p></div>'
                renderEntities()
                renderSessions()
                showChatInterface()

                await Promise.all([loadMessages(), loadEntities()])

                document.getElementById('messageInput').focus()
                console.log('Session selected successfully')
            } catch (error) {
                console.error('Failed to switch session:', error)
                showToast('Не удалось переключить сессию: ' + error.message, 'error')
            } finally {
                state.isLoading = false
            }
        }

        async function deleteSession(sessionId) {
            if (state.isLoading) return
            if (sessionId === state.activeSession) {
                showToast(
                    'Нельзя удалить активную сессию. Сначала переключитесь.',
                    'error'
                )
                return
            }
            if (!confirm('Удалить эту сессию?')) return

            state.isLoading = true
            try {
                await fetch(`${API_BASE}/auth/session/${sessionId}`, {
                    method: 'DELETE',
                })
                await loadSessions()

                if (state.sessions.length === 0) {
                    state.clearSession()
                    document.getElementById('chatInterface').classList.add('hidden')
                    document.getElementById('emptyState').classList.remove('hidden')
                }

                showToast('Сессия удалена', 'info')
            } catch (error) {
                showToast('Не удалось удалить сессию: ' + error.message, 'error')
            } finally {
                state.isLoading = false
            }
        }

        function startRename(sessionId, currentName) {
            const newName = prompt('Введите новое имя сессии:', currentName)
            if (newName && newName !== currentName) {
                renameSession(sessionId, newName)
            }
        }

        async function renameSession(sessionId, newName) {
            try {
                // заглушка — бэк ещё не готов
                showToast('Переименование пока не реализовано', 'info')
                // await fetch(`${API_BASE}/auth/session/${sessionId}?name=${encodeURIComponent(newName)}`, { method: 'PATCH' })
                // await loadSessions()
            } catch (error) {
                showToast('Не удалось переименовать: ' + error.message, 'error')
            }
        }

        function showChatInterface() {
            document.getElementById('emptyState').classList.add('hidden')
            document.getElementById('chatInterface').classList.remove('hidden')

            if (state.activeSession) {
                const session = state.sessions.find(
                    (s) => s.session_id === state.activeSession
                )
                const name =
                    session?.name || `Сессия ${state.activeSession.substring(0, 8)}`
                document.getElementById('sessionName').textContent = name
            }
        }

        // ======= MESSAGES =======
        async function loadMessages() {
            if (!state.activeSession) {
                console.log('No active session, clearing messages')
                state.messages = []
                renderMessages()
                return
            }

            const sessionId = state.activeSession
            console.log('Loading messages for session:', sessionId)

            try {
                const response = await fetch(
                    `${API_BASE}/chatbot/messages?session_id=${sessionId}`
                )

                if (state.activeSession !== sessionId) {
                    console.log('Session changed during load, discarding old messages')
                    return
                }

                if (!response.ok) {
                    if (response.status === 404) {
                        console.log('New session, no messages found')
                        if (state.activeSession === sessionId) {
                            state.messages = []
                            renderMessages()
                        }
                        return
                    }
                    throw new Error('Failed to load messages')
                }

                const data = await response.json()
                console.log('Loaded messages:', data.messages?.length || 0)

                if (state.activeSession === sessionId) {
                    state.messages = data.messages || []
                    renderMessages()
                    console.log('Messages rendered for session:', sessionId)
                } else {
                    console.log('Session changed after load, not rendering')
                }
            } catch (error) {
                console.error('Failed to load messages:', error)
                if (state.activeSession === sessionId) {
                    state.messages = []
                    renderMessages()
                }
            }
        }

        function renderMessages() {
            const container = document.getElementById('messagesContainer')
            container.innerHTML = ''

            if (!state.activeSession) {
                container.innerHTML =
                    '<div class="empty-state"><h3>Сессия не выбрана</h3><p>Выберите или создайте сессию, чтобы начать чат</p></div>'
                return
            }

            if (state.messages.length === 0) {
                container.innerHTML =
                    '<div class="empty-state"><h3>Сообщений пока нет</h3><p>Начните диалог</p></div>'
                return
            }

            state.messages.forEach((msg) => {
                const messageDiv = document.createElement('div')
                messageDiv.className = `message ${msg.role}`

                let contentHtml = `<div class="message-content">${escapeHtml(
                    msg.content
                )}`

                if (msg.role === 'user') {
                    const isClassifying =
                        msg.classification === null || msg.intentClassification === null

                    if (isClassifying) {
                        contentHtml += `
          <div class="classification-loading">Классификация…</div>
        `
                    } else {
                        contentHtml += '<div class="classifications-container">'

                        if (msg.classification) {
                            const categoryLabel = msg.classification.category.replace(
                                /_/g,
                                ' '
                            )
                            contentHtml += `
            <div class="classification-badge ${msg.classification.category}">
              ${categoryLabel}
              <span class="priority-badge ${msg.classification.priority}">
                ${msg.classification.priority}
              </span>
            </div>
          `
                        }

                        if (msg.intentClassification) {
                            const intentLabels = {
                                access_request: 'Получение доступа',
                                information_request: 'Получение справки',
                                problem_solving: 'Решение проблемы',
                                other: 'Другое',
                            }
                            const intentLabel =
                                intentLabels[msg.intentClassification.intent] ||
                                msg.intentClassification.intent
                            contentHtml += `
            <div class="intent-badge ${msg.intentClassification.intent}">
              ${intentLabel}
            </div>
          `
                        }

                        // Add edit button for classification
                        contentHtml += `
            <button class="edit-classification-btn" onclick="openClassificationEditor(${state.messages.indexOf(msg)})" title="Исправить классификацию">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
              </svg>
            </button>
          `

                        contentHtml += '</div>'

                        if (msg.classification && msg.classification.reasoning) {
                            contentHtml += `
            <div class="classification-reasoning">
              Отдел: ${escapeHtml(msg.classification.reasoning)}
            </div>
          `
                        }
                        if (
                            msg.intentClassification &&
                            msg.intentClassification.reasoning
                        ) {
                            contentHtml += `
            <div class="classification-reasoning">
              Намерение: ${escapeHtml(msg.intentClassification.reasoning)}
            </div>
          `
                        }

                        if (msg.roleAssignment && msg.roleAssignment.primary_role) {
                            contentHtml += `
            <div class="role-assignment">
              <div class="role-assignment-title">К кому обратиться:</div>
          `
                            const primary = msg.roleAssignment.primary_role
                            contentHtml += `
            <div class="role-info">
              <div class="role-info-label">Ответственный:</div>
              <div class="role-info-title">${escapeHtml(primary.title)}</div>
              ${primary.position
                                    ? `<div class="role-info-position">${escapeHtml(
                                        primary.position
                                    )}</div>`
                                    : ''
                                }
              <div class="role-info-path">${escapeHtml(
                                    primary.path.join(' → ')
                                )}</div>
            </div>
          `
                            if (msg.roleAssignment.escalation_role) {
                                const e = msg.roleAssignment.escalation_role
                                contentHtml += `
              <div class="role-info">
                <div class="role-info-label">Эскалация:</div>
                <div class="role-info-title">${escapeHtml(e.title)}</div>
                ${e.position
                                        ? `<div class="role-info-position">${escapeHtml(
                                            e.position
                                        )}</div>`
                                        : ''
                                    }
                <div class="role-info-path">${escapeHtml(
                                        e.path.join(' → ')
                                    )}</div>
              </div>

        // ======= CLASSIFIERS =======
        function attachClassificationMetaToMessage(originalContent, classification, intentClassification, roleAssignment) {
            try {
                if (!originalContent || !Array.isArray(state.messages)) return
                for (let i = state.messages.length - 1; i >= 0; i--) {
                    const m = state.messages[i]
                    if (m && m.role === 'user' && m.content === originalContent) {
                        if (classification) m.classification = classification
                        if (intentClassification) m.intentClassification = intentClassification
                        if (roleAssignment) m.roleAssignment = roleAssignment
                        break
                    }
                }
            } catch (_) { }
        }
        async function classifyMessage(message) {
            try {
                const response = await fetch(
                    `${API_BASE}/classifier/classify?session_id=${state.activeSession}`,
                    {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message }),
                    }
                )
                if (!response.ok) throw new Error('Classification failed')
                const data = await response.json()
                return data.classification
            } catch (error) {
                console.error('Classification error:', error)
                return {
                    category: 'other',
                    priority: 'medium',
                    reasoning: 'Классификация недоступна',
                    confidence: 0.5,
                }
            }
        }

        // ======= SEND MESSAGE / STREAM =======
        async function sendMessage() {
            const input = document.getElementById('messageInput')
            const message = input.value.trim()
            if (!message) return

            const sendBtn = document.getElementById('sendBtn')
            sendBtn.disabled = true
            input.disabled = true

            const userMessage = {
                role: 'user',
                content: message,
                classification: null,
                intentClassification: null,
                roleAssignment: null,
            }
            state.messages.push(userMessage)
            renderMessages()
            input.value = ''

            const assistantMsg = { role: 'assistant', content: '' }
            state.messages.push(assistantMsg)
            renderMessages()

            const classificationPromise = classifyMessage(message).then(
                (classification) => {
                    userMessage.classification = classification
                    attachClassificationMetaToMessage(message, classification, null, null)
                    renderMessages()
                    return classification
                }
            )
            const intentClassificationPromise = classifyIntent(message).then(
                (intentClassification) => {
                    userMessage.intentClassification = intentClassification
                    attachClassificationMetaToMessage(message, null, intentClassification, null)
                    renderMessages()
                    return intentClassification
                }
            )

            Promise.all([classificationPromise, intentClassificationPromise]).then(
                ([classification, intentClassification]) => {
                    if (
                        intentClassification &&
                        (intentClassification.intent === 'access_request' ||
                            intentClassification.intent === 'information_request')
                    ) {
                        const domain = classification ? classification.category : null
                        assignRole(message, domain, intentClassification.intent).then(
                            (roleAssignment) => {
                                if (roleAssignment) {
                                    userMessage.roleAssignment = roleAssignment
                                    attachClassificationMetaToMessage(message, null, null, roleAssignment)
                                    renderMessages()
                                }
                            }
                        )
                    }
                }
            )

            try {
                const response = await fetch(
                    `${API_BASE}/chatbot/chat/stream?session_id=${state.activeSession}&user_id=${state.userId}&use_react_agent=true`,
                    {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        // Send only the new user message; LangGraph will append it to existing history
                        body: JSON.stringify({ messages: [userMessage] }),
                    }
                )
                if (!response.ok) throw new Error('Failed to send message')

                const reader = response.body.getReader()
                const decoder = new TextDecoder()

                while (true) {
                    const { done, value } = await reader.read()
                    if (done) break

                    const chunk = decoder.decode(value)
                    const lines = chunk.split('\n')

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            try {
                                const data = JSON.parse(line.substring(6))
                                if (!data.done && data.content) {
                                    assistantMsg.content += data.content
                                    renderMessages()
                                }
                            } catch (e) {
                                console.error('Error parsing chunk:', e)
                            }
                        }
                    }
                }
            } catch (error) {
                assistantMsg.content = 'Ошибка: ' + error.message
                renderMessages()
            } finally {
                sendBtn.disabled = false
                input.disabled = false
                input.focus()
                loadEntities()
            }
        }

            if (!state.activeSession) {

                renderEntities()
                return
            }

            const userId = state.userId
            const sessionId = state.activeSession
            console.log('Loading entities for user:', userId, 'session:', sessionId)

            try {
                const response = await fetch(
                    `${API_BASE}/entities/entities?user_id=${userId}`
                )

                if (state.userId !== userId || state.activeSession !== sessionId) {
                    console.log(
                        'User or session changed during load, discarding old entities'
                    )
                    return
                }

                if (!response.ok) {
                    if (response.status === 404 || response.status === 500) {
                        console.log('No entities found or error')
                        if (
                            state.userId === userId &&
                            state.activeSession === sessionId
                        ) {
                            state.entities = []
                            state.filteredEntities = []
                            renderEntities()
                        }
                        return
                    }
                    throw new Error('Failed to load entities')
                }

                const data = await response.json()
                console.log('Loaded entities:', data.entities?.length || 0)

                if (state.userId === userId && state.activeSession === sessionId) {
                    state.entities = data.entities || []
                    filterEntities(state.entityFilter)
                    console.log('Entities rendered for user:', userId)
                } else {
                    console.log('User or session changed after load, not rendering')
                }
            } catch (error) {
                console.error('Failed to load entities:', error)
                if (state.userId === userId && state.activeSession === sessionId) {
                    state.entities = []
                    state.filteredEntities = []
                    renderEntities()
                }
            }

        async function uploadFiles(files) {
            if (files.length === 0) return

            const collectionName = document.getElementById('uploadCollection').value
            const chunkerType = document.getElementById('chunkerType').value
            const progressDiv = document.getElementById('uploadProgress')
            progressDiv.style.display = 'block'
            progressDiv.innerHTML = `Загружаем файлов: ${files.length}…`

            let successCount = 0
            let errorCount = 0

            for (let i = 0; i < files.length; i++) {
                const file = files[i]
                try {
                    const formData = new FormData()
                    formData.append('file', file)

                    let url = `${API_BASE}/documents/upload?user_id=${state.userId}`
                    if (collectionName)
                        url += `&collection_name=${encodeURIComponent(collectionName)}`
                    url += `&chunker_type=${encodeURIComponent(chunkerType)}`

                    const response = await fetch(url, {
                        method: 'POST',
                        body: formData,
                    })
                    if (!response.ok) {
                        const error = await response.json()
                        throw new Error(error.detail || 'Upload failed')
                    }

                    const result = await response.json()
                    successCount++
                    progressDiv.innerHTML = `Загружено ${successCount}/${files.length}… (${result.chunks_count} чанков из ${file.name})`
                } catch (error) {
                    console.error(`Failed to upload ${file.name}:`, error)
                    errorCount++
                    progressDiv.innerHTML = `Загружено ${successCount}/${files.length}… Ошибка: ${file.name}`
                }
            }

            if (errorCount === 0) {
                showToast(`Успешно загружено файлов: ${successCount}`, 'success')
            } else {
                showToast(
                    `Загружено: ${successCount}, ошибок: ${errorCount}`,
                    'error'
                )
            }

            setTimeout(() => {
                progressDiv.style.display = 'none'
                progressDiv.innerHTML = ''
            }, 3000)

            document.getElementById('fileInput').value = ''
            await loadCollections()
        }

        async function submitClassificationCorrection() {
            if (classificationEditorMessageIndex === null) return

            const msg = state.messages[classificationEditorMessageIndex]

            const category = document.getElementById('correctionCategory').value
            const intent = document.getElementById('correctionIntent').value
            const priority = document.getElementById('correctionPriority').value
            const notes = document.getElementById('correctionNotes').value

            // At least one field must be different
            const hasChanges =
                (category && category !== msg.classification?.category) ||
                (intent && intent !== msg.intentClassification?.intent) ||
                (priority && priority !== msg.classification?.priority)

            if (!hasChanges) {
                alert('Пожалуйста, измените хотя бы одно значение')
                return
            }

            const submitBtn = document.querySelector('.classification-editor-submit')
            submitBtn.disabled = true
            submitBtn.textContent = 'Сохранение...'

            try {
                const response = await fetch('/api/v1/classification/corrections', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_message: msg.content,
                        session_id: state.activeSession,
                        user_id: parseInt(state.userId),
                        predicted_category: msg.classification?.category,
                        predicted_intent: msg.intentClassification?.intent,
                        predicted_priority: msg.classification?.priority,
                        correct_category: category || msg.classification?.category,
                        correct_intent: intent || msg.intentClassification?.intent,
                        correct_priority: priority || msg.classification?.priority,
                        notes: notes || null
                    })
                })

                if (!response.ok) {
                    throw new Error('Failed to save correction')
                }

                // Update local state
                if (category && msg.classification) {
                    msg.classification.category = category
                }
                if (intent && msg.intentClassification) {
                    msg.intentClassification.intent = intent
                }
                if (priority && msg.classification) {
                    msg.classification.priority = priority
                }

                // Re-render messages
                renderMessages()

                // Show success message
                alert('Исправление сохранено! Классификатор будет учитывать это в будущем.')

                closeClassificationEditor()
            } catch (error) {
                console.error('Failed to save correction:', error)
                alert('Ошибка при сохранении исправления')
                submitBtn.disabled = false
                submitBtn.textContent = 'Сохранить исправление'
            }
        }
    </script>
</body>

</html>
