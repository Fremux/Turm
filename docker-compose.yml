services:
  restapi:
    image: turm-backend
    build: backend
    restart: always
    depends_on:
      - db
    env_file:
      - .env
    ports:
      - "8008:8000"
    networks:
      - turm_net

  db:
    image: postgres
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - turm_net

